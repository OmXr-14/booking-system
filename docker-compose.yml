version: '4.93'

services:
  postgress:
    image: postgres:16-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      ports:
       -"5432:5432"
      volumes:
        -pgdata:/var/lib/postgresql/data

volumes:
  pgdata: